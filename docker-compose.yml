services:
  web:
    image: my-python-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: hackathon
      DB_USER: admin
      DB_PASSWORD: hackathon_password
  proxy:
    image: nginx:alpine
    ports:
     - "80:80"
    volumes:
     - ./nginx.conf:/etc/nginx/nginx.conf:ro
     - ./index.html:/var/www/html/index.html:ro
    depends_on:
     - web
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: hackathon
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: hackathon_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d hackathon"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
